name: KICAOI Seed Spam

on:
  workflow_dispatch:
    inputs:
      num_wallets:
        description: 'Number of wallets to use'
        required: false
        default: '252'
      spam_per_run:
        description: 'TX per wallet per run'
        required: false
        default: '3'

jobs:
  seed-spam:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: cd bot && npm ci --prefer-offline 2>/dev/null || npm install

      - name: Run Seed Spam
        env:
          CHAIN: celo
          RPC_URL: ${{ secrets.RPC_URL }}
          KICAOI_WALLETS: ${{ secrets.KICAOI_WALLETS }}
          NUM_WALLETS: ${{ github.event.inputs.num_wallets }}
          SPAM_PER_RUN: ${{ github.event.inputs.spam_per_run }}
          SPAM_BUY_MIN: "0.001"
          CONCURRENCY: "20"
          MIN_GAS_RESERVE: "0.005"
        run: cd bot && npx tsx src/seed-spam.ts
