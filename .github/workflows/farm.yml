name: KICAOI Farm Loop

on:
  schedule:
    # Setiap 6 menit — Wheat grow time = 5 menit, +1 menit buffer
    - cron: '*/6 * * * *'
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bot

      - name: Run farm loop
        run: npm run farm
        working-directory: bot
        env:
          CHAIN:             ${{ vars.KICAOI_CHAIN || 'celo' }}
          KICAOI_ADDRESS:    ${{ vars.KICAOI_ADDRESS }}
          KICAOI_WALLETS:    ${{ secrets.KICAOI_WALLETS }}
          CROP_ID:           ${{ vars.CROP_ID || '1' }}
          BUY_SEED_CELO:     ${{ vars.BUY_SEED_CELO || '0.15' }}
          CONCURRENCY:       ${{ vars.CONCURRENCY || '5' }}
          MIN_GAS_RESERVE:   '0.02'
